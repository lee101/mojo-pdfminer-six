[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pdfminer-six"
version = "0.1.0"
description = "Mojo-accelerated PDF layout analysis for pdfminer.six"
requires-python = ">=3.10"
dependencies = ["numpy", "pdfminer.six"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
